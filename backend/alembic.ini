[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The database URL is injected in alembic/env.py from application settings (DATABASE_URL).
# Logging is also configured there, so no [loggers] sections are needed in this file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
