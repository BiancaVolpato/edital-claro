# Render Blueprint: the backend of the public demo (free web service, Docker).
# The database is a free Neon Postgres (pgvector, does not expire); the frontend
# runs on Vercel. Step by step in docs/DEPLOY.md; the choice in ADR-041.
services:
  - type: web
    name: edital-claro-api
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS us-east-1) and Vercel's default (iad1).
    region: virginia
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    # Deploys only after the CI checks of the commit pass.
    autoDeployTrigger: checksPass
    envVars:
      # Render turns these into Docker build arguments too (the demo image).
      - key: IMAGE_VARIANT
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Neon connection string (postgresql://...?sslmode=require). Asked on creation.
      - key: DATABASE_URL
        sync: false
      # Neon's free compute sleeps after 5 minutes idle and needs a moment to wake.
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "15"
      # Shared with the Vercel project (PROXY_TOKEN there too): lets the frontend
      # name each visitor for the rate limit. Generated by Render; copy it to Vercel.
      - key: PROXY_TOKEN
        generateValue: true
