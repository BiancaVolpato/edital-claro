# Variants compared by `just eval`. The first one is the reference: its errors are
# the ones detailed in the report. Prices per model are in backend/app/llm/pricing.py.
#
#   model      LLM used for every extraction call
#   strategy   "sections": retrieve the relevant sections per group of fields (ADR-013)
#              "direct":   send the document from the start, up to 60 thousand characters

[variants.opus-secoes]
model = "claude-opus-5-5"
strategy = "sections"
description = "Configuração atual: modelo padrão com extração por seções"

[variants.sonnet-secoes]
model = "claude-sonnet-5-5"
strategy = "sections"
description = "Modelo intermediário, metade do preço, com extração por seções"

[variants.haiku-secoes]
model = "claude-haiku-5-5"
strategy = "sections"
description = "Modelo mais barato, com extração por seções"

[variants.opus-direto]
model = "claude-opus-5-5"
strategy = "direct"
description = "Modelo padrão recebendo o início do documento, sem busca por seções"
